plugins {
    id 'java-library'
    // NeoForge 官方构建插件；1.20.5 起运行期就是 Mojang 映射，不再需要重映射和 refmap
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = maven_group

base {
    // 产物：CarianStyle-neoforge-1.21.1-<版本>.jar
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

// Minecraft 1.21.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        configureEach {
            // 控制台中文不乱码
            jvmArguments.addAll('-Dfile.encoding=UTF-8', '-Dconsole.encoding=UTF-8',
                    '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }  // Cloth Config
}

dependencies {
    // Cloth Config：游戏内配置界面，以 jar-in-jar 内嵌，玩家不用另装
    jarJar(api("me.shedaniel.cloth:cloth-config-neoforge:${cloth_version}")) {
        version {
            strictly "[${cloth_version},)"
            prefer cloth_version
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 只对 neoforge.mods.toml 做占位符替换
processResources {
    var props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            version                : version,
            mod_author             : mod_author,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            cloth_version          : cloth_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
