plugins {
    // 两个加载器的构建插件在根项目一起声明（apply false），由子项目各自应用；
    // 放在同一个类加载器里，配置阶段不会出现两个版本的同名类
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    apply plugin: 'java-library'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        // 产物：CarianStyle-<平台>-1.21.1-<版本>.jar；common 的 jar 只给平台模块做类型检查，不发布
        archivesName = "${rootProject.mod_name}-${project.name}-${rootProject.minecraft_version}"
    }

    // Minecraft 1.21.1 需要 Java 21
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()                                                          // MixinExtras、注解库、JUnit
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' } // Mixin 注解
        maven { url 'https://maven.shedaniel.me/' }                             // Cloth Config
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
