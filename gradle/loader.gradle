// 平台模块（neoforge / fabric）共用：把 common 的源码、资源直接编进本模块，
// 每个平台只出一个 jar，玩家不用另装 common。
// common 的源码在每个平台上各编一次，所以 common 里用到的配置类（ModConfigSpec 等）
// 链接的是本平台自己的那份（NeoForge 自带的、Fabric 上 Forge Config API Port 提供的）。
configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    // 类清单（附魔类、事件订阅类）：common 的 generateScanIndex 扫 common 的编译输出生成，见 common/build.gradle
    commonScanIndex {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // 只给编辑器和类型检查用；真正进 jar 的是下面重新编译的源码
    compileOnly(project(':common')) { transitive = false }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    commonScanIndex project(path: ':common', configuration: 'scanIndexElements')

    // common 的源码在这里重新编译，它用的两个注解库平台的编译类路径上不一定有（Fabric 上就没有 jsr305），
    // 跟 common/build.gradle 写同样的版本。只是编译期注解，不进 jar
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.jetbrains:annotations:24.1.0"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
    // 客户端包规则、配置库只许在 config/ 这些源码检查放在 common（见 common/build.gradle 的 checkSourceRules），
    // 平台模块编 common 的源码之前先过一遍，开发运行、测试台、出包都会带上
    dependsOn ':common:checkSourceRules'
}

tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
    from configurations.commonScanIndex
}
