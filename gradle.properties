# Gradle 守护进程堆上限与源码编码
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# 模组信息
mod_id=carianstyle
mod_name=CarianStyle
# 与 1.20.1 / 1.12.2 分支共用版本号，只有修 bug 才动最后一位
mod_version=2.3.2
maven_group=pers.roinflam
mod_author=Roinflam
mod_license=CC BY-NC-SA 4.0

# Minecraft 与 NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.265,)
# FML 加载器版本（1.21.1 是 4.x）
loader_version_range=[4,)

# Cloth Config（配置界面，jar-in-jar 内嵌）
cloth_version=15.0.140

# common：只依赖原版（NeoForm），平台类写进来就编译不过
neo_form_version=1.21.1-20240808.144430
mixin_version=0.8.5
mixinextras_version=0.4.1

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.116.18+1.21.1
# Forge Config API Port：Fabric 上提供 ModConfigSpec（jar-in-jar 内嵌）；common 对它的 NeoForge API 工件编译
fcap_version=21.1.6
# Mod Menu：Fabric 上配置界面的入口，只编译不打包
modmenu_version=11.0.3
